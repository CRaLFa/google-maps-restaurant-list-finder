<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google マップ レストランリスト検索</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Google マップ公式のエリア別レストランリスト (「渋谷: トップリスト」等) を地図から探せる。日本国内のみ。">
<!-- OGP。og:url と og:image は絶対 URL でないとクローラが解決しないため、公開 URL を直書きしている。
カスタムドメインを当てるときはこの 2 行を直すこと (README の URL も同様)。 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://google-maps-restaurant-list-finder-bxnbzgrdda-an.a.run.app/">
<meta property="og:title" content="Google マップ レストランリスト検索">
<meta property="og:description" content="公式のエリア別レストランリストを地図から探す。日本国内のエリアを収録。">
<meta property="og:image" content="https://google-maps-restaurant-list-finder-bxnbzgrdda-an.a.run.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<!-- クラスレス版 (pico.classless.css) ではなく通常版を使う。
     クラスレス版は body 直下の header/main/footer を中央寄せのコンテナにしてしまい、全画面 2 ペインのレイアウトと衝突する。
     通常版はコンテナが .container を付けたときだけ効くので、素の要素の見た目だけを受け取れる。
     バージョンはパッチまで固定する。
     @2 のようなメジャー指定だと、こちらが何もしていなくても配信される CSS が変わり、見た目が勝手に動く。 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<style>
  /* 配色は Pico の変数に委ねる。
     color-scheme の宣言もダークモードの上書きも Pico 側が持っているので、こちらでは別名を張るだけでよい。 */
  :root {
    --bg: var(--pico-background-color);
    --fg: var(--pico-color);
    --border: var(--pico-muted-border-color);
    --muted: var(--pico-muted-color);
    --accent: var(--pico-primary);
    --map-bg: var(--pico-card-sectioning-background-color);
    --note-bg: var(--pico-code-background-color);
    --danger: var(--pico-del-color);
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; }
  #map { flex: 8; min-width: 0; background: var(--map-bg); }
  #map .error { padding: 16px; color: var(--danger); }
  /* AdvancedMarkerElement は <gmp-advanced-marker role="button"> として描かれるため、
     Pico の [role=button] の規則に巻き込まれてピンの背後が青い矩形になる。
     padding も付いて当たり判定が広がり、ピンの指す位置までずれる。
     地図のコントロール (.gm-control-active) は Google 側の CSS が勝つので、ピンだけ打ち消せばよい。
     [role=button] より詳細度を上げる必要があるので #map で修飾している。 */
  #map gmp-advanced-marker {
    padding: 0; border: none; border-radius: 0; background: none; box-shadow: none;
  }
  /* Pico は画面幅に応じて root の font-size を上げる (1280px 以上で 125%)。
     本文を読ませるページ向けの挙動で、一覧を詰めて並べたいサイドバーには大きすぎる。
     ここで px に固定して、サイドバーの中だけ画面幅による拡大から切り離す。 */
  #side {
    flex: 2; min-width: 260px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--bg); font-size: 16px;
  }
  /* Pico はフォーム部品に font-size: 1rem を明示するので、#side の指定が継承で届かない。 */
  #side input, #side button { font-size: inherit; }
  /* #sheet はスマホでボトムシートにするためだけの箱。
     PC では display: contents で無かったことにして、中身を #side の flex アイテムのまま扱う。 */
  #sheet { display: contents; }
  #search { padding: 16px; border-bottom: 1px solid var(--border); }
  #search input { margin-bottom: 0; }

  /* Pico は details を「1 件のアコーディオン」として下線と余白を持たせる。
     入れ子のツリーではその下線が階層ごとに引かれて読みにくいので、ツリーの中だけ余白を詰めて線を消す。 */
  #tree { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #tree details { border-bottom: none; margin-bottom: 0; padding: 0; }
  #tree summary { margin-bottom: 0; padding: 4px 0; color: var(--fg); }
  #tree > .node > summary { font-weight: bold; }
  #tree .node .node { margin-left: 14px; }
  #tree .node.hit > summary { color: var(--accent); }
  #tree ul { list-style: none; margin: 2px 0 6px 28px; padding: 0; }
  /* Pico は li 自身に list-style を持たせるので、ul 側で none にしても行頭記号が消えない。 */
  #tree li { list-style: none; margin: 0; padding: 0; }
  /* リンクは inline のままだと文字の高さ・幅しか当たり判定にならないので、block にして行全体を押せるようにする。
     padding を足さなければ高さは行送りのままで、下線も文字の部分だけに引かれるので見た目は変わらない。 */
  #tree li a { display: block; text-decoration: none; }
  #tree li a:hover { text-decoration: underline; }
  #tree .count { color: var(--muted); font-weight: normal; }
  #tree .empty { color: var(--muted); padding: 12px 4px; }
  footer { padding: 16px; border-top: 1px solid var(--border); }
  #report-btn { width: 100%; margin-bottom: 0; }

  /* Pico の dialog は要素自身が全画面のオーバーレイで、中身の箱は dialog > article が担う。 */
  /* 既定の余白のままだと 8 項目のフォームが縦に伸びて画面に収まらないので、ダイアログの中だけ詰める。 */
  dialog article {
    --pico-spacing: 0.75rem;
    --pico-form-element-spacing-vertical: 0.5rem;
    --pico-typography-spacing-vertical: 0.75rem;
  }
  dialog h2 { font-size: 1.25rem; }
  dialog .req::after { content: " *"; color: var(--danger); }
  dialog .note { color: var(--muted); font-size: 0.75rem; margin: 0.75rem 0 0; }
  /* reCAPTCHA のバッジは全ページの右下に居座り、スマホでは地図をかなり覆ってしまう。
     隠す代わりに、Google が求める帰属表示を報告フォームに置いている。
     display: none だと実行が壊れることがあるので visibility で消す。 */
  .grecaptcha-badge { visibility: hidden; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  dialog .actions button { width: auto; margin-bottom: 0; }
  #report-msg:not(:empty) { margin-top: 10px; padding: 8px; background: var(--note-bg); border-radius: var(--pico-border-radius); }
  /* 吹き出しの中身はサイドバーのツリーと同じ項目なので、字の大きさも #side に揃えて 16px に固定する。
     rem のままだと Pico の画面幅スケーリングに乗ってしまい、InfoWindow の吹き出しの幅に収まらず右端で切れる。 */
  .popup { font-size: 16px; }
  .popup b { display: block; margin-bottom: 2px; }
  /* 所在地は補足情報だが、--muted だと地名が読み取りづらい。本文と同じ濃さにして小さい字だけで区別する。 */
  .popup small { color: var(--fg); }
  .popup a { display: block; margin-top: 4px; color: var(--accent); text-decoration: none; }
  .popup a:hover { text-decoration: underline; }
  /* InfoWindow の中身の箱には Google がインラインで overflow: auto を付けるため、Chrome では常時スクロールバーが出る。
     しかも Google 側の要素は color-scheme が light のままなので、ダークモードでもバーだけ白く浮く。
     吹き出しの中身は数行しかなく縦スクロールは要らないので、まるごと隠す。
     ponytail: 中身が伸びたら切れる。行数が増えたら overflow-y: auto に戻して色を当てる。 */
  .gm-style-iw-d { overflow: hidden !important; }

  /* 地図の colorScheme はタイルしか暗くせず、InfoWindow の吹き出しは白のままになる。
     中の文字だけダークモードの明るい色になって白地に白文字で消えるため、吹き出し側を暗くする。
     gm-style-iw-* は Google の内部クラスなので、変わって白に戻ることがありうる。
     そのとき文字が消えないよう .popup 自身にも背景を持たせ、最悪でも白い吹き出しの中の暗い箱として読めるようにしておく。 */
  @media (prefers-color-scheme: dark) {
    .popup { background: var(--bg); }
    .gm-style-iw-c, .gm-style-iw-d { background: var(--bg) !important; }
    .gm-style-iw-tc::after { background: var(--bg) !important; }
    /* 閉じるボタンの ✕ は mask-image + background-color で描かれている。
       Google 側がダークモードでは既に白にしているので、invert すると逆に黒くなって沈む。
       追随を当てにせず本文と同じ色に固定する。インラインスタイルで色が付くので !important が要る。 */
    .gm-style-iw-c button span { background-color: var(--fg) !important; }
  }

  @media (max-width: 768px) {
    body { display: block; }
    /* 地図を全画面に敷き、その上にシートを重ねる。
       position で全画面にしてはいけない。
       Maps JS API が地図のコンテナに position: relative をインラインで書き込むので、
       fixed も absolute も上書きされて高さが 0 に潰れる。
       シートは fixed で流れの外に居るため、通常の流れのまま height: 100% で画面を覆える。 */
    #map { height: 100%; }
    /* #side はシートを載せるだけのスクロールコンテナ。
       スナップ点が「隙間の上端 (最小化)」と「シートの下端 (展開)」の 2 つしかないので、
       指のスワイプがそのまま最小化 / 展開の切り替えになる。ドラッグを拾う JS は要らない。
       DOM では #side が #map より前にあるので、重ね順は z-index で明示する。
       display は block に戻すこと。
       flex のままだと隙間とシートが flex アイテムとして縮められ、合計が画面の高さに収まってしまう。
       溢れないのでスクロールが生まれず、スナップもスワイプも効かなくなる。 */
    #side {
      display: block; position: fixed; inset: 0; z-index: 1;
      min-width: 0; border: none; background: none;
      overflow-y: scroll; overscroll-behavior-y: contain;
      scroll-snap-type: y mandatory; scrollbar-width: none;
      /* 隙間の部分は地図を操作させたいので、当たり判定はシート本体だけに戻す。 */
      pointer-events: none;
    }
    #side::-webkit-scrollbar { display: none; }
    /* 最小化したときにシートが覗く分 (ハンドル + 検索欄) だけ残した隙間。 */
    #side::before { content: ""; display: block; height: calc(100% - 96px); scroll-snap-align: start; }
    /* scroll-snap-align は end にする。
       start だと「シートの上端が画面の上端に来る位置」に吸着しようとするが、
       シートは画面より低いのでそこまでスクロールできず、展開側のスナップ点に届かない。 */
    #sheet {
      display: flex; flex-direction: column; height: 60%;
      scroll-snap-align: end; pointer-events: auto;
      background: var(--bg); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgb(0 0 0 / 0.25);
    }
    /* つまんで動かせることを示すハンドル。 */
    #sheet::before {
      content: ""; flex: none; width: 36px; height: 4px; margin: 8px auto 4px;
      border-radius: 2px; background: var(--muted);
    }
    /* 指でのタップは狙いが数 px ずれるので、ツリーの行間を広げて隣の行を踏みにくくする。 */
    #tree summary { padding: 9px 0; }
    #tree li a { padding: 3px 0; }
    /* 狭い画面ではダイアログを全画面にする。箱は dialog そのものではなく article なので、そちらを伸ばす。 */
    dialog > article { width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div id="side">
  <div id="sheet">
    <!-- Pico が input[type=search] に虫眼鏡アイコンを描くので、プレースホルダの 🔍 は外している。 -->
    <!-- placeholder はアクセシブルネームにならないので、aria-label を別に持たせる。 -->
    <div id="search"><input id="q" type="search" aria-label="地名で検索" placeholder="地名で検索" autocomplete="off"></div>
    <div id="tree"></div>
    <footer><button id="report-btn">漏れているリストを報告</button></footer>
  </div>
</div>
<div id="map"></div>

<dialog id="report">
  <article>
    <form id="report-form" method="dialog">
      <h2>漏れているリストの報告</h2>
      <label class="req" for="f-area">エリア名</label>
      <input id="f-area" name="area" maxlength="50" required placeholder="例: 川越市">
      <label class="req" for="f-pref">都道府県</label>
      <select id="f-pref" name="pref" required></select>
      <label for="f-url">共有 URL (任意)</label>
      <input id="f-url" name="shareUrl" maxlength="300" placeholder="https://maps.app.goo.gl/...">
      <label for="f-comment">コメント (任意)</label>
      <textarea id="f-comment" name="comment" maxlength="1000" rows="3"></textarea>
      <label for="f-contact">連絡先 (任意)</label>
      <input id="f-contact" name="contact" maxlength="200">
      <p class="note">連絡先は確認の連絡にのみ使い、90 日後に自動削除します。</p>
      <p class="note">このサイトは reCAPTCHA によって保護されており、Google の<a href="https://policies.google.com/privacy" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="https://policies.google.com/terms" target="_blank" rel="noopener">利用規約</a>が適用されます。</p>
      <div id="report-msg"></div>
      <div class="actions">
        <button type="button" id="report-cancel" class="secondary">閉じる</button>
        <button type="submit" id="report-submit">送信</button>
      </div>
    </form>
  </article>
</dialog>

<script>
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

// リストの種類ごとの絵文字。
// 定義順がそのまま表示順 (トップリスト → 地元で人気 → トレンド) になる。
const KIND_EMOJI = { "トップリスト": "🏆", "地元で人気": "💎", "トレンド": "📢" };
const KINDS = Object.keys(KIND_EMOJI);
const kindLabel = k => (KIND_EMOJI[k] ? KIND_EMOJI[k] + " " : "") + k;

const treeEl = document.getElementById("tree");
const sideEl = document.getElementById("side");
// スマホ表示のシートは初期スクロール位置 (0) が最小化側なので、開いた状態から始める。
// PC では #side にスクロールが無いのでどちらも空振りする。
sideEl.scrollTop = sideEl.scrollHeight;
let map, infoWindow;
let areas = [];   // { key, area, loc, pref, lat, lng, lists[], marker, el }
let roots = [];   // ツリーの根 (都道府県)。ノードは { path, label, lat, area, children[] }
let siteKey = "";

// リストの取得と Maps API のロードは互いに独立なので並行して走らせる。
const listsP = fetch("/api/lists").then(r => r.json());

fetch("/api/config").then(r => r.json()).then(cfg => {
  siteKey = cfg.recaptchaSiteKey;
  if (siteKey) {
    const s = document.createElement("script");
    s.src = "https://www.google.com/recaptcha/enterprise.js?render=" + encodeURIComponent(siteKey);
    document.head.append(s);
  }
  if (!cfg.mapsApiKey) {
    document.getElementById("map").innerHTML =
      '<p class="error">Google マップの API キーが未設定です。'
      + 'サーバの MAPS_API_KEY を設定してください。</p>';
    listsP.then(rows => { buildAreas(rows); render(); });
    return;
  }
  window.initMap = () => start(cfg);
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js"
    + "?key=" + encodeURIComponent(cfg.mapsApiKey)
    + "&map_ids=" + encodeURIComponent(cfg.mapId)
    + "&callback=initMap&loading=async&libraries=marker&language=ja&region=JP";
  s.async = true;
  document.head.append(s);
});

async function start(cfg) {
  const { Map, InfoWindow } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
  map = new Map(document.getElementById("map"), {
    center: { lat: 37.5, lng: 137.5 },
    zoom: 5,
    mapId: cfg.mapId,
    // ブラウザのダークモード設定に地図を合わせる。
    // 初期化時にしか効かないので、途中で OS の設定が変わっても地図は切り替わらない。
    colorScheme: google.maps.ColorScheme.FOLLOW_SYSTEM,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
  });
  infoWindow = new InfoWindow();
  // スマホ表示ではシートが画面の下側を覆うので、地図の中心がその裏に隠れて北日本しか見えない。
  // 隠れる分の半分だけ中心を南にずらし、見えている部分の真ん中に日本が来るようにする。
  // panBy は地図が一度描かれるまで効かないので idle を待つ。
  // PC の #sheet は display: contents で箱を持たず height が 0 になるので、ここは素通りする。
  google.maps.event.addListenerOnce(map, "idle", () => {
    const sheet = document.getElementById("sheet").getBoundingClientRect();
    if (sheet.height) map.panBy(0, (innerHeight - sheet.top) / 2);
  });

  buildAreas(await listsP);
  for (const a of areas) {
    a.marker = new AdvancedMarkerElement({ map, position: { lat: a.lat, lng: a.lng }, title: a.area });
    a.marker.addListener("click", () => {
      infoWindow.setContent(popupHTML(a));
      infoWindow.open({ map, anchor: a.marker });
      revealArea(a);
    });
  }
  render();
}

// エリア (エリア名 + 所在地) 単位にまとめる。同名エリアが市を跨ぐので所在地込みで束ねる。
function buildAreas(rows) {
  const byArea = new Map();
  for (const r of rows) {
    const key = r.loc + "|" + r.area;
    if (!byArea.has(key)) {
      byArea.set(key, { key, area: r.area, loc: r.loc, pref: r.pref, lat: r.lat, lng: r.lng, lists: [] });
    }
    byArea.get(key).lists.push(r);
  }
  areas = [...byArea.values()];
  // 表示順は KIND_EMOJI の定義順。
  // 未知の種類は末尾に回す。
  const rank = k => (KINDS.indexOf(k) + 1 || KINDS.length + 1);
  for (const a of areas) a.lists.sort((x, y) => rank(x.kind) - rank(y.kind) || x.kind.localeCompare(y.kind, "ja"));
  buildTree();
}

// 所在地はそのエリアの「親のフルパス」になっている。
// 例: 池袋 の所在地は 東京都豊島区、豊島区 の所在地は 東京都。
// つまり 所在地 + エリア名 をフルパスとして扱えば、親子関係がそのまま木になる。
function buildTree() {
  const nodes = new Map();   // フルパス -> ノード
  // 親が分かっているノードは parent に持たせる。
  // undefined のものだけ、あとでパスの前方一致から親を推測する。
  const node = (path, parent) => {
    if (!nodes.has(path)) nodes.set(path, { path, label: path, parent, lat: -Infinity, area: null, children: [] });
    const n = nodes.get(path);
    if (n.parent === undefined) n.parent = parent;
    return n;
  };
  for (const a of areas) {
    node(a.pref, "");                 // 都道府県は木の根
    node(a.loc);                      // 収集対象になっていない市区を中間ノードとして補う
    // エリア名が都道府県名そのもの (東京都のリストなど) なら、根の都道府県ノードに直接持たせる。
    // 別ノードにすると 東京都 > 東京都 と同じラベルが二重に出てしまう。
    if (a.area === a.pref) node(a.pref).area = a;
    else node(a.loc + a.area, a.loc).area = a;   // エリアの親は所在地そのもの
  }

  // 親の分からない中間ノードだけ「自分より短い既知のパスのうち最長のもの」を親にする。
  // 候補は所在地として実在するパスに限る。
  // エリアのパスまで候補にすると、東京都東京都 (東京都のリスト) が
  // 東京都東京 (東京のリスト) の子に化けるような取り違えが起きる。
  const locPaths = [...new Set(areas.flatMap(a => [a.pref, a.loc]))].sort((x, y) => y.length - x.length);
  // ラベルは親のパスを差し引いた残り。東京都台東区 なら 台東区 になる。
  roots = [];
  for (const n of nodes.values()) {
    const parent = n.parent
      ?? locPaths.find(p => p.length < n.path.length && n.path.startsWith(p));
    if (!parent) { roots.push(n); continue; }
    n.label = n.path.slice(parent.length);
    nodes.get(parent).children.push(n);
  }

  // 代表緯度 (自身と子孫の最大緯度) の降順、つまり北から南に並べる。
  // 座標があるので JIS 都道府県コードの配列を持たずに済む。
  for (const n of roots) resolveLat(n);
  roots.sort((x, y) => y.lat - x.lat);
}

function resolveLat(n) {
  if (n.area) n.lat = n.area.lat;
  for (const c of n.children) n.lat = Math.max(n.lat, resolveLat(c));
  n.children.sort((x, y) => y.lat - x.lat);
  return n.lat;
}

function popupHTML(a) {
  const links = a.lists.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(kindLabel(l.kind))}</a>`).join("");
  return `<div class="popup"><b>${esc(a.area)}</b><small>${esc(a.loc)}</small>${links}</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// 検索語がエリアに当たるか。
// 所在地は「都道府県 + 市区」の連結なので、都道府県の部分だけ先頭一致にする。
// 部分一致のままだと「京都」が「東京都」に当たり、京都府の 14 件が東京都の 60 件に埋もれる。
// 市区の部分は部分一致のままにして、「名古屋」で名古屋市の区を引けるようにする。
function matches(a, q) {
  return a.area.includes(q)
    || a.pref.startsWith(q)
    || a.loc.slice(a.pref.length).includes(q);
}

// 検索語にヒットするエリアだけを残してツリーとピンを描き直す。
function render() {
  const q = document.getElementById("q").value.trim();
  const hit = a => !q || matches(a, q);

  treeEl.textContent = "";
  let shown = 0;
  for (const n of roots) shown += renderNode(n, treeEl, hit, !!q);
  if (!shown) treeEl.innerHTML = '<p class="empty">該当するエリアがありません。</p>';

  for (const a of areas) {
    if (a.marker) a.marker.map = hit(a) ? map : null;
  }
}

// ノードとその子孫を描き、表示したエリア数を返す。
// 0 なら自身も子孫もヒットしていないので、そのノードは追加しない。
// 自分にリストが無く子も 1 つだけのノードは、開いても選択肢が増えない。
// その唯一の子を最初から開いておき、リンクまで一手で辿り着けるようにする (onlyChild)。
// 自分にリストがあるなら、開いた先で「そのエリア自身か子か」を選ぶ意味があるので開かない。
function renderNode(n, parentEl, hit, open, onlyChild) {
  const d = document.createElement("details");
  d.className = "node";
  d.open = open || !!onlyChild;
  const sum = document.createElement("summary");
  d.append(sum);

  let count = 0;
  if (n.area && hit(n.area)) {
    count = 1;
    const ul = document.createElement("ul");
    ul.innerHTML = n.area.lists
      .map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(kindLabel(l.kind))}</a></li>`)
      .join("");
    d.append(ul);
    sum.addEventListener("click", () => focusArea(n.area));
    n.area.el = d;
  }
  for (const c of n.children) count += renderNode(c, d, hit, open, n.children.length === 1 && !n.area);
  if (!count) return 0;

  // 件数は子を持つノード (都道府県・市区) にだけ出す。末端に (1) と付けても情報がない。
  sum.innerHTML = esc(n.label) + (n.children.length ? ` <span class="count">(${count})</span>` : "");
  parentEl.append(d);
  return count;
}

// ツリー項目のクリック -> 地図をそのエリアへ寄せて吹き出しを開く。
function focusArea(a) {
  if (!map || !a.marker) return;
  // スマホ表示では地図の中心がシートの裏に隠れる。
  // ツリーを選んだ時点で見たいのは地図なので、シートを最小化して吹き出しを表に出す。
  sideEl.scrollTo({ top: 0, behavior: "smooth" });
  map.setCenter({ lat: a.lat, lng: a.lng });
  if (map.getZoom() < 11) map.setZoom(11);
  infoWindow.setContent(popupHTML(a));
  infoWindow.open({ map, anchor: a.marker });
}

// ピンのクリック -> ツリー側の該当項目を開いて見える位置までスクロールする。
// scrollIntoView が動かすのは祖先のスクロールボックスだけなので、PC では #tree だけが動く。
// スマホ表示ではシートを載せている #side も祖先のスクロールボックスなので、
// 最小化していたシートがここで一緒に開く。ページ全体はどちらでも伸びない。
function revealArea(a) {
  if (!a.el) return;
  for (let el = a.el; el; el = el.parentElement && el.parentElement.closest("details")) el.open = true;
  // スマホでシートを下げているときは、ピンのタップでシートを引き上げない。
  // スクロールコンテナが #side なので、scrollIntoView するとシートまで一緒に上がってしまう。
  // gap はシートを畳める余白の量で、スクロールを持たない PC では 0 になり素通りする。
  const gap = sideEl.scrollHeight - sideEl.clientHeight;
  if (!gap || sideEl.scrollTop > gap / 2) a.el.scrollIntoView({ block: "center", behavior: "smooth" });
  a.el.classList.add("hit");
  setTimeout(() => a.el.classList.remove("hit"), 1500);
}

let timer;
document.getElementById("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 120);
});

// ---- 報告フォーム ----
const dlg = document.getElementById("report");
const msg = document.getElementById("report-msg");
document.getElementById("f-pref").innerHTML =
  '<option value="">選択してください</option>' +
  PREFS.map(p => `<option>${p}</option>`).join("");
document.getElementById("report-btn").onclick = () => { msg.textContent = ""; dlg.showModal(); };
document.getElementById("report-cancel").onclick = () => dlg.close();

document.getElementById("report-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("report-submit");
  btn.disabled = true;
  msg.textContent = "送信中…";
  try {
    const body = Object.fromEntries(new FormData(e.target));
    body.token = siteKey
      ? await grecaptcha.enterprise.execute(siteKey, { action: "report" })
      : "";
    const res = await fetch("/api/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      e.target.reset();
      msg.textContent = "報告を受け付けました。ありがとうございます。";
    } else if (res.status === 429) {
      msg.textContent = "報告が多すぎます。しばらく待ってから再度お試しください。";
    } else {
      msg.textContent = "送信できませんでした: " + (await res.text()).trim();
    }
  } catch (err) {
    msg.textContent = "送信できませんでした。通信環境を確認してください。";
  } finally {
    btn.disabled = false;
  }
});
</script>
