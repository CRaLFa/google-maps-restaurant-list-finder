<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google マップ公式レストランリスト検索</title>
<style>
  /* color-scheme を宣言しておくとフォーム部品とスクロールバーが OS の設定に追随する。 */
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #222; --border: #d6d6d6; --muted: #666; --accent: #1a73e8;
    --map-bg: #e8e8e8; --note-bg: #f3f3f3; --danger: #c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124; --fg: #e8eaed; --border: #3c4043; --muted: #9aa0a6; --accent: #8ab4f8;
      --map-bg: #303134; --note-bg: #2a2b2e; --danger: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; font-family: system-ui, sans-serif; font-size: 14px;
    background: var(--bg); color: var(--fg);
  }
  #map { flex: 8; min-width: 0; background: var(--map-bg); }
  #map .error { padding: 16px; color: var(--danger); }
  #side {
    flex: 2; min-width: 260px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--bg);
  }
  #search { padding: 8px; border-bottom: 1px solid var(--border); }
  #search input { width: 100%; padding: 8px; font-size: 15px; }
  #tree { flex: 1; overflow-y: auto; padding: 4px 8px; font-size: 16px; }
  #tree summary { cursor: pointer; padding: 4px 0; color: var(--fg); }
  #tree > .node > summary { font-weight: bold; }
  #tree .node .node { margin-left: 14px; }
  #tree .node.hit > summary { color: var(--accent); }
  #tree ul { list-style: none; margin: 2px 0 6px 28px; padding: 0; }
  #tree li a { color: var(--accent); text-decoration: none; }
  #tree li a:hover { text-decoration: underline; }
  #tree .count { color: var(--muted); font-weight: normal; }
  #tree .empty { color: var(--muted); padding: 12px 4px; }
  footer { padding: 8px; border-top: 1px solid var(--border); }
  button { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #report-btn { width: 100%; }
  dialog {
    border: 1px solid var(--border); border-radius: 6px; padding: 16px; max-width: 420px; width: 90%;
    background: var(--bg); color: var(--fg);
  }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog label { display: block; margin: 10px 0 3px; }
  dialog input, dialog select, dialog textarea {
    width: 100%; padding: 6px; font-size: 14px; font-family: inherit;
  }
  dialog .req::after { content: " *"; color: var(--danger); }
  dialog .note { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  dialog .note a { color: var(--accent); }
  /* reCAPTCHA のバッジは全ページの右下に居座り、スマホでは地図をかなり覆ってしまう。
     隠す代わりに、Google が求める帰属表示を報告フォームに置いている。
     display: none だと実行が壊れることがあるので visibility で消す。 */
  .grecaptcha-badge { visibility: hidden; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #report-msg:not(:empty) { margin-top: 10px; padding: 8px; background: var(--note-bg); border-radius: 4px; }
  .popup b { display: block; margin-bottom: 2px; font-size: 14px; }
  /* 所在地は補足情報だが、--muted だと地名が読み取りづらい。本文と同じ濃さにして小さい字だけで区別する。 */
  .popup small { color: var(--fg); }
  .popup a { display: block; margin-top: 4px; color: var(--accent); text-decoration: none; }
  .popup a:hover { text-decoration: underline; }

  /* 地図の colorScheme はタイルしか暗くせず、InfoWindow の吹き出しは白のままになる。
     中の文字だけダークモードの明るい色になって白地に白文字で消えるため、吹き出し側を暗くする。
     gm-style-iw-* は Google の内部クラスなので、変わって白に戻ることがありうる。
     そのとき文字が消えないよう .popup 自身にも背景を持たせ、最悪でも白い吹き出しの中の暗い箱として読めるようにしておく。 */
  @media (prefers-color-scheme: dark) {
    .popup { background: var(--bg); }
    .gm-style-iw-c, .gm-style-iw-d { background: var(--bg) !important; }
    .gm-style-iw-tc::after { background: var(--bg) !important; }
    /* 閉じるボタンの ✕ は mask-image + background-color で描かれている。
       Google 側がダークモードでは既に白にしているので、invert すると逆に黒くなって沈む。
       追随を当てにせず本文と同じ色に固定する。インラインスタイルで色が付くので !important が要る。 */
    .gm-style-iw-c button span { background-color: var(--fg) !important; }
  }

  @media (max-width: 768px) {
    /* 縦積みでは地図を上にしたいので、DOM 順 (リスト -> 地図) を order で入れ替える。 */
    body { flex-direction: column; }
    #map { flex: none; height: 50vh; order: -1; }
    #side { flex: 1; min-width: 0; border-right: none; border-top: 1px solid var(--border); }
    dialog { max-width: none; width: 100%; height: 100%; max-height: none; border: none; border-radius: 0; }
  }
</style>
</head>
<body>
<div id="side">
  <div id="search"><input id="q" type="search" placeholder="🔍 地名で検索" autocomplete="off"></div>
  <div id="tree"></div>
  <footer><button id="report-btn">漏れているリストを報告</button></footer>
</div>
<div id="map"></div>

<dialog id="report">
  <form id="report-form" method="dialog">
    <h2>漏れているリストの報告</h2>
    <label class="req" for="f-area">エリア名</label>
    <input id="f-area" name="area" maxlength="50" required placeholder="例: 川越市">
    <label class="req" for="f-pref">都道府県</label>
    <select id="f-pref" name="pref" required></select>
    <label for="f-url">共有 URL</label>
    <input id="f-url" name="shareUrl" maxlength="300" placeholder="https://maps.app.goo.gl/...">
    <label for="f-comment">コメント</label>
    <textarea id="f-comment" name="comment" maxlength="1000" rows="3"></textarea>
    <label for="f-contact">連絡先 (任意)</label>
    <input id="f-contact" name="contact" maxlength="200">
    <p class="note">連絡先は確認の連絡にのみ使い、90 日後に自動削除します。</p>
    <p class="note">このサイトは reCAPTCHA によって保護されており、Google の<a href="https://policies.google.com/privacy" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="https://policies.google.com/terms" target="_blank" rel="noopener">利用規約</a>が適用されます。</p>
    <div id="report-msg"></div>
    <div class="actions">
      <button type="button" id="report-cancel">閉じる</button>
      <button type="submit" id="report-submit">送信</button>
    </div>
  </form>
</dialog>

<script>
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

const treeEl = document.getElementById("tree");
let map, infoWindow;
let areas = [];   // { key, area, loc, pref, lat, lng, lists[], marker, el }
let roots = [];   // ツリーの根 (都道府県)。ノードは { path, label, lat, area, children[] }
let siteKey = "";

// リストの取得と Maps API のロードは互いに独立なので並行して走らせる。
const listsP = fetch("/api/lists").then(r => r.json());

fetch("/api/config").then(r => r.json()).then(cfg => {
  siteKey = cfg.recaptchaSiteKey;
  if (siteKey) {
    const s = document.createElement("script");
    s.src = "https://www.google.com/recaptcha/enterprise.js?render=" + encodeURIComponent(siteKey);
    document.head.append(s);
  }
  if (!cfg.mapsApiKey) {
    document.getElementById("map").innerHTML =
      '<p class="error">Google マップの API キーが未設定です。'
      + 'サーバの MAPS_API_KEY を設定してください。</p>';
    listsP.then(rows => { buildAreas(rows); render(); });
    return;
  }
  window.initMap = () => start(cfg);
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js"
    + "?key=" + encodeURIComponent(cfg.mapsApiKey)
    + "&map_ids=" + encodeURIComponent(cfg.mapId)
    + "&callback=initMap&loading=async&libraries=marker&language=ja&region=JP";
  s.async = true;
  document.head.append(s);
});

async function start(cfg) {
  const { Map, InfoWindow } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
  map = new Map(document.getElementById("map"), {
    center: { lat: 37.5, lng: 137.5 },
    zoom: 5,
    mapId: cfg.mapId,
    // ブラウザのダークモード設定に地図を合わせる。
    // 初期化時にしか効かないので、途中で OS の設定が変わっても地図は切り替わらない。
    colorScheme: google.maps.ColorScheme.FOLLOW_SYSTEM,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
  });
  infoWindow = new InfoWindow();

  buildAreas(await listsP);
  for (const a of areas) {
    a.marker = new AdvancedMarkerElement({ map, position: { lat: a.lat, lng: a.lng }, title: a.area });
    a.marker.addListener("click", () => {
      infoWindow.setContent(popupHTML(a));
      infoWindow.open({ map, anchor: a.marker });
      revealArea(a);
    });
  }
  render();
}

// エリア (エリア名 + 所在地) 単位にまとめる。同名エリアが市を跨ぐので所在地込みで束ねる。
function buildAreas(rows) {
  const byArea = new Map();
  for (const r of rows) {
    const key = r.loc + "|" + r.area;
    if (!byArea.has(key)) {
      byArea.set(key, { key, area: r.area, loc: r.loc, pref: r.pref, lat: r.lat, lng: r.lng, lists: [] });
    }
    byArea.get(key).lists.push(r);
  }
  areas = [...byArea.values()];
  // 表示順は トップリスト → 地元で人気 → トレンド の固定順。
  // 未知の種類は末尾に回す。
  const kindOrder = ["トップリスト", "地元で人気", "トレンド"];
  const rank = k => (kindOrder.indexOf(k) + 1 || kindOrder.length + 1);
  for (const a of areas) a.lists.sort((x, y) => rank(x.kind) - rank(y.kind) || x.kind.localeCompare(y.kind, "ja"));
  buildTree();
}

// 所在地はそのエリアの「親のフルパス」になっている。
// 例: 池袋 の所在地は 東京都豊島区、豊島区 の所在地は 東京都。
// つまり 所在地 + エリア名 をフルパスとして扱えば、親子関係がそのまま木になる。
function buildTree() {
  const nodes = new Map();   // フルパス -> ノード
  // 親が分かっているノードは parent に持たせる。
  // undefined のものだけ、あとでパスの前方一致から親を推測する。
  const node = (path, parent) => {
    if (!nodes.has(path)) nodes.set(path, { path, label: path, parent, lat: -Infinity, area: null, children: [] });
    const n = nodes.get(path);
    if (n.parent === undefined) n.parent = parent;
    return n;
  };
  for (const a of areas) {
    node(a.pref, "");                 // 都道府県は木の根
    node(a.loc);                      // 収集対象になっていない市区を中間ノードとして補う
    // エリア名が都道府県名そのもの (東京都のリストなど) なら、根の都道府県ノードに直接持たせる。
    // 別ノードにすると 東京都 > 東京都 と同じラベルが二重に出てしまう。
    if (a.area === a.pref) node(a.pref).area = a;
    else node(a.loc + a.area, a.loc).area = a;   // エリアの親は所在地そのもの
  }

  // 親の分からない中間ノードだけ「自分より短い既知のパスのうち最長のもの」を親にする。
  // 候補は所在地として実在するパスに限る。
  // エリアのパスまで候補にすると、東京都東京都 (東京都のリスト) が
  // 東京都東京 (東京のリスト) の子に化けるような取り違えが起きる。
  const locPaths = [...new Set(areas.flatMap(a => [a.pref, a.loc]))].sort((x, y) => y.length - x.length);
  // ラベルは親のパスを差し引いた残り。東京都台東区 なら 台東区 になる。
  roots = [];
  for (const n of nodes.values()) {
    const parent = n.parent
      ?? locPaths.find(p => p.length < n.path.length && n.path.startsWith(p));
    if (!parent) { roots.push(n); continue; }
    n.label = n.path.slice(parent.length);
    nodes.get(parent).children.push(n);
  }

  // 代表緯度 (自身と子孫の最大緯度) の降順、つまり北から南に並べる。
  // 座標があるので JIS 都道府県コードの配列を持たずに済む。
  for (const n of roots) resolveLat(n);
  roots.sort((x, y) => y.lat - x.lat);
}

function resolveLat(n) {
  if (n.area) n.lat = n.area.lat;
  for (const c of n.children) n.lat = Math.max(n.lat, resolveLat(c));
  n.children.sort((x, y) => y.lat - x.lat);
  return n.lat;
}

function popupHTML(a) {
  const links = a.lists.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.kind)}</a>`).join("");
  return `<div class="popup"><b>${esc(a.area)}</b><small>${esc(a.loc)}</small>${links}</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// 検索語がエリアに当たるか。
// 所在地は「都道府県 + 市区」の連結なので、都道府県の部分だけ先頭一致にする。
// 部分一致のままだと「京都」が「東京都」に当たり、京都府の 14 件が東京都の 60 件に埋もれる。
// 市区の部分は部分一致のままにして、「名古屋」で名古屋市の区を引けるようにする。
function matches(a, q) {
  return a.area.includes(q)
    || a.pref.startsWith(q)
    || a.loc.slice(a.pref.length).includes(q);
}

// 検索語にヒットするエリアだけを残してツリーとピンを描き直す。
function render() {
  const q = document.getElementById("q").value.trim();
  const hit = a => !q || matches(a, q);

  treeEl.textContent = "";
  let shown = 0;
  for (const n of roots) shown += renderNode(n, treeEl, hit, !!q);
  if (!shown) treeEl.innerHTML = '<p class="empty">該当するエリアがありません。</p>';

  for (const a of areas) {
    if (a.marker) a.marker.map = hit(a) ? map : null;
  }
}

// ノードとその子孫を描き、表示したエリア数を返す。
// 0 なら自身も子孫もヒットしていないので、そのノードは追加しない。
// 自分にリストが無く子も 1 つだけのノードは、開いても選択肢が増えない。
// その唯一の子を最初から開いておき、リンクまで一手で辿り着けるようにする (onlyChild)。
// 自分にリストがあるなら、開いた先で「そのエリア自身か子か」を選ぶ意味があるので開かない。
function renderNode(n, parentEl, hit, open, onlyChild) {
  const d = document.createElement("details");
  d.className = "node";
  d.open = open || !!onlyChild;
  const sum = document.createElement("summary");
  d.append(sum);

  let count = 0;
  if (n.area && hit(n.area)) {
    count = 1;
    const ul = document.createElement("ul");
    ul.innerHTML = n.area.lists
      .map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.kind)}</a></li>`)
      .join("");
    d.append(ul);
    sum.addEventListener("click", () => focusArea(n.area));
    n.area.el = d;
  }
  for (const c of n.children) count += renderNode(c, d, hit, open, n.children.length === 1 && !n.area);
  if (!count) return 0;

  // 件数は子を持つノード (都道府県・市区) にだけ出す。末端に (1) と付けても情報がない。
  sum.innerHTML = esc(n.label) + (n.children.length ? ` <span class="count">(${count})</span>` : "");
  parentEl.append(d);
  return count;
}

// ツリー項目のクリック -> 地図をそのエリアへ寄せて吹き出しを開く。
function focusArea(a) {
  if (!map || !a.marker) return;
  map.setCenter({ lat: a.lat, lng: a.lng });
  if (map.getZoom() < 11) map.setZoom(11);
  infoWindow.setContent(popupHTML(a));
  infoWindow.open({ map, anchor: a.marker });
}

// ピンのクリック -> ツリー側の該当項目を開いて見える位置までスクロールする。
// 縦積みのスマホ表示ではツリーが地図の下にあり、スクロールすると開いた吹き出しが画面外に出てしまう。
// 開くだけにして、スクロールは PC 表示のときだけ行う。
function revealArea(a) {
  if (!a.el) return;
  for (let el = a.el; el; el = el.parentElement && el.parentElement.closest("details")) el.open = true;
  if (!matchMedia("(max-width: 768px)").matches) a.el.scrollIntoView({ block: "center", behavior: "smooth" });
  a.el.classList.add("hit");
  setTimeout(() => a.el.classList.remove("hit"), 1500);
}

let timer;
document.getElementById("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 120);
});

// ---- 報告フォーム ----
const dlg = document.getElementById("report");
const msg = document.getElementById("report-msg");
document.getElementById("f-pref").innerHTML =
  '<option value="">選択してください</option>' +
  PREFS.map(p => `<option>${p}</option>`).join("");
document.getElementById("report-btn").onclick = () => { msg.textContent = ""; dlg.showModal(); };
document.getElementById("report-cancel").onclick = () => dlg.close();

document.getElementById("report-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("report-submit");
  btn.disabled = true;
  msg.textContent = "送信中…";
  try {
    const body = Object.fromEntries(new FormData(e.target));
    body.token = siteKey
      ? await grecaptcha.enterprise.execute(siteKey, { action: "report" })
      : "";
    const res = await fetch("/api/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      e.target.reset();
      msg.textContent = "報告を受け付けました。ありがとうございます。";
    } else if (res.status === 429) {
      msg.textContent = "報告が多すぎます。しばらく待ってから再度お試しください。";
    } else {
      msg.textContent = "送信できませんでした: " + (await res.text()).trim();
    }
  } catch (err) {
    msg.textContent = "送信できませんでした。通信環境を確認してください。";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
